name: memora

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: memora-db
    environment:
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: memora
      POSTGRES_DB: memora
    # Host port 5433 — 5432 is taken by the local Windows Postgres service.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - memora-pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora -d memora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: memora-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - memora-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ocr:
    build:
      context: ./infra/ocr
      args:
        # Stays 0. Paddle was built and tested here on 2026-08-22 and cannot run:
        # paddlepaddle 3.3.1 dies in a oneDNN kernel at inference, in the container
        # as well as on Windows. A gigabyte of wheels that cannot execute is not
        # worth the build time. See README, "Known".
        WITH_PADDLE: "0"
    container_name: memora-ocr
    environment:
      OCR_ENGINE: tesseract
    # Bound to loopback only. The API runs on the host during development, so it needs
    # a port - but the service holds document bytes and must not be on the LAN.
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      # Completes a real inference. An engine that imports and then dies at inference
      # is the failure already seen with paddle, and an import check would miss it.
      test: ["CMD-SHELL", "python -c \"import urllib.request,json,sys; r=json.load(urllib.request.urlopen('http://localhost:8080/health')); sys.exit(0 if r['status']=='ok' else 1)\""]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Local stage 1. Free-only is a project constraint, and this is the only extractor
  # configuration with no daily cap, no deprecation risk, and no query leaving the
  # machine - see prompts/local-stage1.md. CPU only: no GPU exists here, and none will
  # exist on a phone either.
  ollama:
    image: ollama/ollama:latest
    container_name: memora-ollama
    # Loopback only, like the OCR service. It holds no credentials and reaches nothing.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  memora-pgdata:
  memora-redisdata:
  # Model weights, ~2GB per model. A named volume so a container rebuild does not
  # re-download them.
  ollama-models:
