[project]
name = "memora"
version = "0.1.0"
description = "Memora AI — personal digital-memory system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "arq>=0.26",
    "python-multipart>=0.0.20",
    "pymupdf>=1.25",
    "tiktoken>=0.8",
    "google-genai>=1.0",
    "pillow>=12.3.0",
    "mutagen>=1.48.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "jiwer>=3.0",
]
# OCR benchmark only. Heavy and platform-fussy, so it stays out of the default
# sync - nobody installs paddle to run the API.
#   uv sync --group bench
bench = [
    "jiwer>=3.0",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
    "paddleocr>=2.9",
    "paddlepaddle>=2.6",
    "google-genai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memora"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["support"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"migrations/*" = ["E501", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
