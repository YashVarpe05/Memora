name: memora-online
x-runtime: &runtime
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://memora_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@db:5432/memora
  REDIS_URL: redis://redis:6379/0
  OCR_URL: http://ocr:8080
  STAGE1_PROVIDER: rules
  # lexical needs no account. Set EMBEDDING_PROVIDER=gemini and GEMINI_API_KEY for meaning
  # search; the image has no torch, so EMBEDDING_PROVIDER=local needs a semantic image.
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-lexical}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
  BLOB_ROOT: /state/blobs
  PAIRING_STORE: /state/auth/devices.sqlite3
  OPERATOR_SECRET: ${OPERATOR_SECRET:?Set OPERATOR_SECRET}
  # Optional: lets an APK built with the same secret enroll itself. Leave empty to disable.
  ENROLLMENT_SECRET: ${ENROLLMENT_SECRET:-}
  HF_HOME: /models
  PUBLIC_API_URL: https://${MEMORA_DOMAIN:?Set MEMORA_DOMAIN}/api
  CORS_ORIGINS: '["https://${MEMORA_DOMAIN}","http://localhost","https://localhost","capacitor://localhost"]'
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memora
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./infra/production/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U memora']
      interval: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  ocr:
    build: ./infra/ocr
    environment:
      OCR_LANGUAGES: eng+hin+mar
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        WITH_SEMANTIC: ${WITH_SEMANTIC:-0}
    environment:
      <<: *runtime
      MIGRATION_DATABASE_URL: postgresql+asyncpg://memora:${DB_PASSWORD}@db:5432/memora
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        WITH_SEMANTIC: ${WITH_SEMANTIC:-0}
    environment: *runtime
    volumes: [state:/state, models:/models]
    command: [uvicorn, 'memora.main:app', --host, 0.0.0.0, --port, '8000', --no-access-log, --no-proxy-headers]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        WITH_SEMANTIC: ${WITH_SEMANTIC:-0}
    environment: *runtime
    volumes: [state:/state, models:/models]
    command: [python, -m, memora.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infra/production/Dockerfile.web
    environment:
      MEMORA_DOMAIN: ${MEMORA_DOMAIN}
    ports: ['80:80', '443:443']
    volumes: [certificates:/data, caddy_config:/config]
    depends_on: [api]
    restart: unless-stopped
volumes:
  database:
  state:
  models:
  certificates:
  caddy_config:
